# Builds one app's APK and attaches it to a GitHub release. Each app lives on its own branch:
#
#   branch    builds        release tag        release asset
#   forever   WoW Forever   forever-v<ver>     WoW-Forever.apk
#   retail    WoW Retail    retail-v<ver>      WoW-Retail.apk
#   octowow   OctoWoW       octowow-v<ver>     OctoWoW.apk
#   skyrim    Skyrim SE     skyrim-v<ver>      Skyrim-SE.apk
#
# Publishing: a push to one of those branches that changes versionName in app/build.gradle.kts
# creates that app's release for the new version. Pushing a matching tag (e.g. octowow-v2.3.2)
# publishes too. Other pushes, and manual runs, only build the APK as a workflow artifact. Each
# app's updater picks the newest release carrying its own APK, so the three don't interfere.
#
# Signing: set these repository secrets to sign with your own key, so installed apps accept updates:
#   ANDROID_KEYSTORE_BASE64  (base64 of the .jks file)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build falls back to a debug key that is different on every run, so Android will
# refuse to install the next release over this one.
name: Release APK

on:
  push:
    branches: [forever, retail, octowow, skyrim]
    paths: [app/build.gradle.kts, .github/workflows/release-apk.yml]
    tags: ["forever-v*", "retail-v*", "octowow-v*", "skyrim-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide app and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The branch name, or the tag's prefix, says which app this is.
          case "${GITHUB_REF_NAME%%-v*}" in
            forever) app=forever; flavor=forever; asset=WoW-Forever.apk ;;
            retail) app=retail; flavor=retail; asset=WoW-Retail.apk ;;
            octowow) app=octowow; flavor=octo; asset=OctoWoW.apk ;;
            skyrim) app=skyrim; flavor=skyrim; asset=Skyrim-SE.apk ;;
            *) echo "::error::$GITHUB_REF_NAME isn't an app branch (forever, retail, octowow, skyrim)"; exit 1 ;;
          esac
          version_of() { sed -n 's/^ *versionName = "\(.*\)"/\1/p'; }
          version=$(version_of < app/build.gradle.kts)
          tag="$app-v$version"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch -q --depth=1 origin "$BEFORE"
            previous=$(git show "$BEFORE:app/build.gradle.kts" | version_of)
            if [ "$previous" != "$version" ] && ! gh release view "$tag" > /dev/null 2>&1; then
              publish=true
            fi
          fi
          echo "App $app, release $tag: publish=$publish"
          {
            echo "tag=$tag"
            echo "flavor=$flavor"
            echo "asset=$asset"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        env:
          FLAVOR: ${{ steps.release.outputs.flavor }}
        run: |
          # The secrets Gradle plugin fails without local.properties, which is gitignored.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew ":app:assemble${FLAVOR^}ModernRelease"

      - name: Collect APK
        env:
          FLAVOR: ${{ steps.release.outputs.flavor }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/${FLAVOR}Modern/release/app-$FLAVOR-modern-release.apk" "dist/$ASSET"
          sha256sum "dist/$ASSET" | tee "dist/$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: dist/

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
          else
            # Creates the tag on this commit when it doesn't exist yet.
            gh release create "$TAG" "dist/$ASSET" --target "$GITHUB_SHA" --title "${ASSET%.apk} ${TAG##*-}" \
              --notes "${ASSET%.apk} ${TAG##*-} for Android. Install $ASSET, or update from inside the app."
          fi
