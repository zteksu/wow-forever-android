# Builds the OctoWoW APK and attaches it to a GitHub release.
#
# Publishing: a push to main or the release branch that changes app/build.gradle.kts (or this file)
# creates the v<versionName> tag and release if they don't exist yet, so bumping versionName is all a
# release needs. Pushing a v* tag yourself works too; it must match versionName, since the in-app
# updater compares the tag with the installed version. Manual runs only produce the APK artifact.
#
# Signing: set these repository secrets to sign with your own key, so installed apps accept updates:
#   ANDROID_KEYSTORE_BASE64  (base64 of the .jks file)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build falls back to a debug key that is different on every run, so Android will
# refuse to install the next release over this one.
name: Release APK

on:
  push:
    branches: [main, claude/great-pasteur-2ruwc7]
    paths: [app/build.gradle.kts, .github/workflows/release-apk.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          tag="v$version"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "$tag" > /dev/null 2>&1; then
            publish=true
          fi
          echo "Release $tag: publish=$publish"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        run: ./gradlew :app:assembleOctoModernRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/octoModern/release/app-octo-modern-release.apk dist/OctoWoW.apk
          sha256sum dist/OctoWoW.apk | tee dist/OctoWoW.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OctoWoW
          path: dist/

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/OctoWoW.apk --clobber
          else
            # Creates the tag on this commit when it doesn't exist yet.
            gh release create "$TAG" dist/OctoWoW.apk --target "$GITHUB_SHA" --title "OctoWoW $TAG" --latest \
              --notes "OctoWoW $TAG for Android. Install OctoWoW.apk, or update from inside the app."
          fi
