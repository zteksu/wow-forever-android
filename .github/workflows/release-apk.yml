# Builds the OctoWoW APK and attaches it to a GitHub release.
#
# Push a tag like v2.3.1 to publish that release (it must match versionName in app/build.gradle.kts,
# since the in-app updater compares the tag with the installed version). Run it by hand from the
# Actions tab to just get the APK as a workflow artifact.
#
# Signing: set these repository secrets to sign with your own key, so installed apps accept updates:
#   ANDROID_KEYSTORE_BASE64  (base64 of the .jks file)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build falls back to a debug key that is different on every run, so Android will
# refuse to install the next release over this one.
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        run: ./gradlew :app:assembleOctoModernRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/octoModern/release/app-octo-modern-release.apk dist/OctoWoW.apk
          sha256sum dist/OctoWoW.apk | tee dist/OctoWoW.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OctoWoW
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/OctoWoW.apk --clobber
          else
            gh release create "$TAG" dist/OctoWoW.apk --title "OctoWoW $TAG" --latest \
              --notes "OctoWoW $TAG for Android. Install OctoWoW.apk, or update from inside the app."
          fi
